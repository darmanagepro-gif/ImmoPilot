# Envoie l'application (dossier application/dist) dans le projet Google Apps Script et met à jour le déploiement
# existant : même adresse /exec, donc le site, Android et iPhone affichent aussitôt la nouvelle version.
# Réglage unique : voir application/GITHUB_VERS_APPS_SCRIPT.md (secrets CLASPRC_JSON et APPS_SCRIPT_ID).
name: Déployer sur Apps Script

on:
  push:
    branches: [main]
    paths: ["application/dist/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

env:
  # Identifiant du déploiement de l'application web (la partie entre /s/ et /exec de l'URL). Il n'est pas secret.
  DEPLOYMENT_ID: AKfycbwK-erOdZm1bbrbntsJ-U36mF94CpmKHlnrhvPiqqlLoaGeAUGOsaIWiBbh07iBPvY

jobs:
  deploy:
    # Jamais depuis une copie (fork) du dépôt : les secrets ne sont utilisés que dans votre dépôt.
    if: github.repository == 'darmanagepro-gif/ImmoPilot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::error::Secrets CLASPRC_JSON et APPS_SCRIPT_ID manquants : suivez application/GITHUB_VERS_APPS_SCRIPT.md"
            exit 1
          fi
          test -f application/dist/ImmoPilot.gs && test -f application/dist/Index.html && test -f application/dist/appsscript.json
          grep -q "FIN DU FICHIER ImmoPilot.gs" application/dist/ImmoPilot.gs || { echo "::error::ImmoPilot.gs incomplet"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer clasp (outil officiel de Google)
        run: npm install -g @google/clasp@3.4.1

      - name: Préparer les identifiants (temporaires)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > application/dist/.clasp.json

      - name: Envoyer le code dans Apps Script
        working-directory: application/dist
        run: clasp push --force

      - name: Mettre à jour le déploiement (même adresse /exec)
        working-directory: application/dist
        run: clasp update-deployment "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: Effacer les identifiants
        if: always()
        run: rm -f "$HOME/.clasprc.json" application/dist/.clasp.json
