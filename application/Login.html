<script>

/* Écrans publics : connexion, mot de passe oublié, acceptation d'invitation, réinitialisation, portail voyageur. */
const Public = {
  frame: function (title, sub, body) {
    const app = clear($("app"));
    const langSel = h("select", { class: "lang", "aria-label": t("Langue"), onchange: function (e) { setLang(e.target.value); App.start(); } }, langOpts().map(function (l) { return h("option", { value: l[0] }, l[1]); }));

    app.appendChild(h("div", { class: "auth" },
      h("aside", { class: "auth-side" }, h("div", { class: "brand", style: { padding: 0 } }, brandMark(), h("div", null, h("b", null, "DarPilot"), h("small", null, ED.tagline))),
        h("div", null, h("h1", null, t(ED.taglineKey)), h("p", null, t("Réservations, ménage, maintenance, baux et finances réunis pour les propriétaires, les conciergeries et leurs équipes de terrain.")))),

  /** Démonstration publique : choix d'une vue sans compte (paquet de démonstration uniquement). */

        Public.legalLinks()));

  artisans: function () { Public.login("", { artisan: true }); },

  /* ----------------------------- Inscription en ligne ----------------------------- */
  /** Page large (inscription) : en-tête de marque, étapes, contenu. */

        h("a", { href: "#", onclick: function (ev) { ev.preventDefault(); Public.legal("confidentialite", function () { Public._redraw ? Public._redraw() : Public.login(); }); } }, t("Politique de confidentialité"))));
  },

  },

  companyFields: function (info, kind, show) {
    const fr = info.country === "FR", forms = (info.legalForms[kind === "AGENCY" ? "AGENCY" : "COMPANY"] || []).map(function (x) { return [x, x === "AUTRE" ? t("Autre") : x]; });

    if (fr) f.push({ k: "siret", l: "N° SIRET", req: true, ph: "123 456 789 00012", help: "14 chiffres, visible sur votre Kbis ou l'avis de situation INSEE." }, { k: "rcsCity", l: "Ville du RCS", ph: "Toulouse" }, { k: "vatNumber", l: "N° de TVA intracommunautaire", ph: "FR12345678901" });
    else f.push({ k: "ice", l: "ICE (identifiant commun de l'entreprise)", req: true, ph: "15 chiffres" }, { k: "rcNumber", l: "N° de registre de commerce (RC)", req: true }, { k: "rcCity", l: "Tribunal (ville du RC)", ph: "Marrakech" },
      { k: "ifNumber", l: "Identifiant fiscal (IF)" }, { k: "patente", l: "N° de taxe professionnelle (patente)" }, { k: "cnss", l: "N° d'affiliation CNSS" });
    return f.map(function (x) { return Object.assign(x, show ? { show: show } : {}); });

      { k: "password", l: "Choisissez un mot de passe", t: "password", req: true, ac: "new-password", help: "10 caractères minimum, avec lettres et chiffres." },
      { k: "password2", l: "Confirmez le mot de passe", t: "password", req: true, ac: "new-password" },

      { k: "acceptTerms", l: provider ? "J'accepte les conditions de référencement des prestataires et je certifie l'exactitude de mes informations." : "J'accepte les conditions générales d'abonnement et d'utilisation.", t: "checkbox", full: true },
      { k: "acceptPrivacy", l: "J'ai lu la politique de confidentialité et j'accepte le traitement de mes données pour la création du compte.", t: "checkbox", full: true }];

  checkAccount: function (v) {
    if (v.password !== v.password2) return t("Les mots de passe ne correspondent pas.");
    if (!v.acceptStatus || !v.acceptTerms || !v.acceptPrivacy) return t("Cochez les trois cases d'acceptation pour continuer.");
    return "";

  signupInfo: function () { if (!Public._info) Public._info = apiP("signup.info", {}); return Public._info.catch(function (e) { Public._info = null; throw e; }); },

  /** Inscription d'un client : 1. profil, 2. forfait, 3. informations, 4. code e-mail ; puis contrat et paiement dans l'espace. */
  signup: function () {
    const steps = ["Votre profil", "Votre forfait", "Vos informations", "Confirmation de l'e-mail", "Contrat et paiement"];
    const st8 = { step: 0, profile: "", planCode: "", values: { ownerType: "INDIVIDUAL" } };
    Public.wide(t("Créer mon compte DarPilot"), steps, 0, h("div", { class: "loading" }, t("Chargement…")));
    Public.signupInfo().then(function (info) {
      const draw = function () {
        Public._redraw = draw;
        const body = h("div", { class: "signup-body" });
        if (st8.step === 0) {
          body.appendChild(h("h2", null, t("Vous êtes…")));
          body.appendChild(Public.choiceCards([
            { v: "OWNER", i: "⌂", t: "Propriétaire", d: "Vous possédez un ou plusieurs biens (location courte ou longue durée) et les gérez vous-même, ou avec une agence." },
            { v: "AGENCY", i: "⌘", t: "Agence ou conciergerie", d: "Agence immobilière, conciergerie ou gestionnaire : vous gérez les biens de vos clients (mandants) et vos équipes." }], st8.profile, function (v) { st8.profile = v; draw(); }));
          body.appendChild(Public.statusBox(info, false));
          body.appendChild(Public.navRow(null, function () { if (!st8.profile) return toast(t("Choisissez votre profil."), "bad"); st8.step = 1; draw(); }));
        } else if (st8.step === 1) {
          body.appendChild(h("h2", null, t("Choisissez votre forfait")));
          body.appendChild(h("p", { class: "muted" }, t("Sans engagement : changez de forfait ou résiliez à tout moment depuis votre espace.") + (info.country === "FR" ? " " + t("Prix hors taxes pour les professionnels (TVA en sus), toutes taxes comprises pour les particuliers.") : "")));
          body.appendChild(h("div", { class: "plan-cards" }, info.plans.map(function (pl) {
            const on = st8.planCode === pl.planCode;
            return h("button", { type: "button", class: "plan-card" + (on ? " on" : "") + (pl.planCode === "PRO" ? " best" : ""), "aria-pressed": on ? "true" : "false", onclick: function () { st8.planCode = pl.planCode; draw(); } },
              pl.planCode === "PRO" ? h("span", { class: "ribbon" }, t("Le plus choisi")) : null,
              h("b", { class: "pname" }, pl.name), h("span", { class: "price" }, fmtMoney(pl.price, pl.currency), h("small", null, " / " + t({ MONTHLY: "mois", QUARTERLY: "trimestre", YEARLY: "an" }[pl.periodicity] || pl.periodicity))),
              pl.trialDays ? h("span", { class: "trial" }, pl.trialDays + " " + t("jours d'essai gratuit")) : null,
              h("ul", { class: "limits" }, h("li", null, h("b", null, String(pl.maxProperties)), " " + t("biens")), h("li", null, h("b", null, String(pl.maxUsers)), " " + t("utilisateurs")), h("li", null, h("b", null, pl.storageMb >= 1000 ? Math.round(pl.storageMb / 1000) + " Go" : pl.storageMb + " Mo"), " " + t("de stockage"))),
              h("ul", { class: "feats" }, pl.features.map(function (f) { return h("li", null, "✓ " + st("feat." + f)); })),
              h("span", { class: "btn " + (on ? "primary" : "") }, on ? "✓ " + t("Sélectionné") : t("Choisir")));
          })));
          const pl = info.plans.filter(function (x) { return x.planCode === st8.planCode; })[0];
          body.appendChild(h("div", { class: "alert info" }, info.cardPayment ? (pl && pl.trialDays ? t("Paiement : vous signez votre contrat puis enregistrez votre carte (formulaire sécurisé SumUp). Le premier prélèvement a lieu à la fin de l'essai gratuit, puis à chaque échéance.") : t("Paiement : vous signez votre contrat puis enregistrez votre carte (formulaire sécurisé SumUp). La première échéance est prélevée aussitôt, puis à chaque échéance."))
            : t("Paiement : après la signature de votre contrat, le règlement se fait par virement selon les instructions qui vous seront transmises.")));
          body.appendChild(Public.navRow(function () { st8.step = 0; draw(); }, function () { if (!st8.planCode) return toast(t("Choisissez un forfait."), "bad"); st8.step = 2; draw(); }));
        } else if (st8.step === 2) {
          const ag = st8.profile === "AGENCY", isCo = function (v) { return ag || v.ownerType === "COMPANY"; };
          const fields = [];
          if (!ag) fields.push({ k: "ownerType", l: "Vous êtes", t: "select", req: true, opts: [["INDIVIDUAL", t("Un particulier")], ["COMPANY", t("Une société (SCI, SARL…)")]], full: true });
          fields.push({ k: "firstName", l: "Prénom", req: true, ac: "given-name" }, { k: "lastName", l: "Nom", req: true, ac: "family-name" }, { k: "phone", l: "Téléphone mobile", t: "tel", req: true, ac: "tel", help: "Pour la signature de votre contrat par SMS et le support." },
            { k: "city", l: "Ville", req: true, def: ED.city || "" });
          if (!ag) fields.push({ k: "homeAddress", l: "Adresse postale", req: true, full: true, show: function (v) { return v.ownerType !== "COMPANY"; } });
          Public.companyFields(info, ag ? "AGENCY" : "COMPANY", ag ? null : isCo).forEach(function (x) { fields.push(x); });
          if (ag && info.country === "FR") fields.push({ k: "cardNumber", l: "N° de carte professionnelle (loi Hoguet)", help: "Mention « Gestion immobilière » ou « Transactions » : obligatoire pour gérer ou louer les biens de tiers." },
            { k: "cardIssuer", l: "CCI qui a délivré la carte" }, { k: "guarantor", l: "Garant financier" });
          Public.accountFields().forEach(function (x) { fields.push(x); });
          // Commercial DarPilot qui accompagne le client (facultatif) : pré-rempli par le lien de parrainage ?ref=CODE.
          let ref = ""; try { ref = (new URLSearchParams(location.search).get("ref") || "").slice(0, 80); } catch (e) { ref = ""; }
          if (ref && !st8.values.salesRef) st8.values.salesRef = ref;
          fields.push({ k: "salesRef", l: "Votre commercial DarPilot (facultatif)", full: true, help: "Nom et prénom ou code du commercial qui vous a présenté DarPilot." });
          const f = buildForm(fields, st8.values), err = h("div", { class: "alert bad hidden" });
          body.appendChild(h("h2", null, ag ? t("Votre agence et vous") : t("Vos informations")));
          body.appendChild(h("p", { class: "muted" }, t("Ces informations figurent sur votre contrat d'abonnement et vos factures.")));
          body.appendChild(f.el); body.appendChild(err);
          const go = function (b) {
            const v = f.get(); st8.values = v;
            let m = f.validate() || Public.checkAccount(v);
            if (m) { err.textContent = m; err.classList.remove("hidden"); err.scrollIntoView({ block: "center" }); return; }
            err.classList.add("hidden"); b.disabled = true;
            apiP("signup.start", Object.assign({}, v, { kind: "CLIENT", profile: st8.profile, planCode: st8.planCode, locale: S.lang })).then(function (r) {
              st8.request = r; st8.email = v.email; st8.step = 3; draw();
            }).catch(function (e) { b.disabled = false; err.textContent = errMsg(e); err.classList.remove("hidden"); err.scrollIntoView({ block: "center" }); });
          };
          body.appendChild(Public.navRow(function () { st8.values = f.get(); st8.step = 1; draw(); }, function (ev) { go(ev && ev.currentTarget ? ev.currentTarget : this); }, t("Recevoir mon code")));
        } else {
          body.appendChild(Public.codeStep(st8.request, function (r) { Public._redraw = null; Public.enterAfterSignup(r, "onboarding"); }, function () { st8.step = 2; draw(); }));
        }
        Public.wide(t("Créer mon compte DarPilot"), steps, st8.step, body);
      };
      draw();
    }).catch(function (e) { Public.wide(t("Créer mon compte DarPilot"), steps, 0, h("div", { class: "alert bad" }, errMsg(e))); });
  },
  /** Saisie du code reçu par e-mail (commune aux deux parcours). */
  codeStep: function (req, done, back) {
    const code = h("input", { type: "text", inputmode: "numeric", autocomplete: "one-time-code", maxlength: 6, placeholder: "123456", class: "code-input", "aria-label": t("Code reçu") });
    const err = h("div", { class: "alert bad hidden" }), info = h("div", { class: "alert info" }, t("Nous avons envoyé un code à 6 chiffres à") + " " + req.destination + ". " + t("Il est valable") + " " + req.expiresInMinutes + " min. " + t("Pensez à vérifier vos courriers indésirables."));
    const confirm = btn(t("Valider et créer mon compte"), function () {
      if (!/^\d{6}$/.test(code.value.trim())) { err.textContent = t("Saisissez le code à 6 chiffres."); err.classList.remove("hidden"); return; }
      confirm.disabled = true; err.classList.add("hidden");
      apiP("signup.confirm", { requestId: req.requestId, code: code.value.trim() }).then(done).catch(function (e) { confirm.disabled = false; err.textContent = errMsg(e); err.classList.remove("hidden"); });
    }, "primary lg");
    const resend = btn(t("Renvoyer un code"), function () { resend.disabled = true; apiP("signup.resend", { requestId: req.requestId }).then(function (r) { toast(t("Nouveau code envoyé à") + " " + r.destination, "good"); setTimeout(function () { resend.disabled = false; }, 30000); }).catch(function (e) { resend.disabled = false; showErr(e); }); });
    code.addEventListener("keydown", function (e) { if (e.key === "Enter") confirm.click(); });
    setTimeout(function () { code.focus(); }, 50);
    return h("div", { class: "code-step" }, h("h2", null, t("Confirmez votre adresse e-mail")), info, h("div", { class: "field" }, code), err,
      h("div", { class: "actions signup-nav" }, btn("← " + t("Modifier mes informations"), back), resend, confirm));
  },
  enterAfterSignup: function (r, hash) {
    apiCacheClear(); S.token = r.token; store("ip_token", r.token); S.me = r.me; S.meta = r.meta || null; S.onboard = true;
    history.replaceState(null, "", location.pathname + "#" + hash);
    App.enter();
    toast(t("Compte créé. Bienvenue sur DarPilot !"), "good");
  },

  /** Référencement d'un artisan : 1. métiers, 2. statut, 3. informations légales et assurance, 4. code ; puis dépôt des pièces. */
  providerSignup: function () {
    const steps = ["Corps de métier", "Votre statut", "Informations légales", "Confirmation de l'e-mail", "Pièces justificatives"];
    const st8 = { step: 0, trades: [], businessType: "", zones: "", values: { hasRcPro: false } };
    Public.wide(t("Se référencer comme artisan"), steps, 0, h("div", { class: "loading" }, t("Chargement…")));
    Public.signupInfo().then(function (info) {
      const fr = info.country === "FR";
      const needDec = function () { return fr && st8.trades.some(function (x) { return info.decennaleTrades.indexOf(x) >= 0; }); };
      const draw = function () {
        Public._redraw = draw;
        const body = h("div", { class: "signup-body" });
        if (st8.step === 0) {
          body.appendChild(h("h2", null, t("Quel est votre corps de métier ?")));
          body.appendChild(h("p", { class: "muted" }, t("Choisissez un ou plusieurs métiers : les propriétaires et agences vous trouvent par métier et par zone d'intervention.")));
          body.appendChild(h("div", { class: "trade-grid" }, info.trades.map(function (code) {
            const on = st8.trades.indexOf(code) >= 0;
            return h("button", { type: "button", class: "trade" + (on ? " on" : ""), "aria-pressed": on ? "true" : "false", onclick: function () { if (on) st8.trades.splice(st8.trades.indexOf(code), 1); else st8.trades.push(code); draw(); } }, (on ? "✓ " : "") + st(code));
          })));
          const zones = h("input", { type: "text", value: st8.zones || "", placeholder: fr ? "Toulouse, Blagnac, Colomiers" : "Marrakech, Guéliz, Palmeraie", id: "zones" });
          zones.addEventListener("input", function () { st8.zones = zones.value; });
          body.appendChild(h("div", { class: "field", style: { maxWidth: "560px", margin: "14px 0" } }, h("label", { for: "zones" }, t("Zones d'intervention (villes ou quartiers, séparés par des virgules)")), zones));
          body.appendChild(Public.statusBox(info, true));
          body.appendChild(Public.navRow(null, function () { if (!st8.trades.length) return toast(t("Choisissez au moins un corps de métier."), "bad"); st8.step = 1; draw(); }));
        } else if (st8.step === 1) {
          body.appendChild(h("h2", null, t("Votre statut")));
          body.appendChild(Public.choiceCards([
            { v: "AE", i: "◔", t: fr ? "Auto-entrepreneur (micro-entreprise)" : "Auto-entrepreneur", d: fr ? "Entreprise individuelle au régime micro : SIRET, sans société." : "Inscrit au Registre national de l'auto-entrepreneur." },
            { v: "COMPANY", i: "▣", t: "Société", d: fr ? "SARL, EURL, SAS, SASU… immatriculée au RCS." : "SARL, SARL AU, SA… immatriculée au registre de commerce." }], st8.businessType, function (v) { st8.businessType = v; draw(); }));
          if (st8.businessType) {
            const rules = info.docRules[st8.businessType].slice();
            body.appendChild(h("div", { class: "panel", style: { marginTop: "16px" } }, h("h3", { style: { marginTop: 0 } }, t("Pièces à fournir après la création de votre compte")),
              h("ul", { class: "doc-rules" }, rules.map(function (r) { return h("li", null, h("b", null, r.label), r.help ? h("span", { class: "small muted" }, " — " + r.help) : null); }),
                h("li", null, h("b", null, t("Attestation d'assurance RC professionnelle")), h("span", { class: "small muted" }, " — " + t("si vous en avez une (recommandée)."))),
                needDec() ? h("li", null, h("b", null, t("Attestation d'assurance décennale")), h("span", { class: "small muted" }, " — " + t("obligatoire pour vos métiers du bâtiment."))) : null),
              h("p", { class: "small muted" }, t("Formats acceptés : PDF, JPEG, PNG (4 Mo maximum). Vous pouvez photographier les documents avec votre téléphone."))));
          }
          body.appendChild(Public.navRow(function () { st8.step = 0; draw(); }, function () { if (!st8.businessType) return toast(t("Choisissez votre statut."), "bad"); st8.step = 2; draw(); }));
        } else if (st8.step === 2) {
          const co = st8.businessType === "COMPANY";
          const fields = [{ k: "firstName", l: "Prénom", req: true, ac: "given-name" }, { k: "lastName", l: "Nom", req: true, ac: "family-name" }, { k: "phone", l: "Téléphone mobile", t: "tel", req: true, ac: "tel" }];
          if (co) Public.companyFields(info, "COMPANY").forEach(function (x) { fields.push(x); });
          else {
            fields.push({ k: "legalName", l: "Nom commercial", help: "Facultatif : à défaut, vos prénom et nom." }, { k: "address", l: "Adresse professionnelle", req: true, full: true });
            if (fr) fields.push({ k: "siret", l: "N° SIRET", req: true, ph: "123 456 789 00012", help: "14 chiffres, sur votre avis de situation INSEE." }, { k: "vatNumber", l: "N° de TVA intracommunautaire", help: "Laissez vide si vous bénéficiez de la franchise en base de TVA (art. 293 B du CGI)." });
            else fields.push({ k: "aeNumber", l: "N° d'inscription au registre de l'auto-entrepreneur", req: true }, { k: "ice", l: "ICE (identifiant commun de l'entreprise)", req: true, ph: "15 chiffres" }, { k: "ifNumber", l: "Identifiant fiscal (IF)" });
          }
          fields.push({ k: "hasRcPro", l: "J'ai une assurance responsabilité civile professionnelle (RC Pro)", t: "checkbox", full: true });
          const rc = function (v) { return !!v.hasRcPro; };
          fields.push({ k: "rcInsurer", l: "Assureur RC Pro", req: true, show: rc }, { k: "rcPolicy", l: "N° de police (contrat)", req: true, show: rc }, { k: "rcValidUntil", l: "Valable jusqu'au", t: "date", req: true, show: rc },
            { k: "rcInsurerAddress", l: "Adresse de l'assureur", req: true, full: true, show: rc });
          if (needDec()) fields.push({ k: "decInsurer", l: "Assureur décennale", req: true }, { k: "decPolicy", l: "N° de police décennale", req: true }, { k: "decValidUntil", l: "Décennale valable jusqu'au", t: "date", req: true });
          Public.accountFields(true).forEach(function (x) { fields.push(x); });
          const f = buildForm(fields, st8.values), err = h("div", { class: "alert bad hidden" });
          body.appendChild(h("h2", null, co ? t("Votre société") : t("Votre entreprise")));
          if (needDec()) body.appendChild(h("div", { class: "alert warn" }, t("Vos métiers relèvent des travaux du bâtiment : l'assurance décennale est obligatoire en France (art. L. 241-1 du Code des assurances).")));
          body.appendChild(f.el); body.appendChild(err);
          const go = function (b) {
            const v = f.get(); st8.values = v;
            const m = f.validate() || Public.checkAccount(v);
            if (m) { err.textContent = m; err.classList.remove("hidden"); err.scrollIntoView({ block: "center" }); return; }
            err.classList.add("hidden"); b.disabled = true;
            apiP("signup.start", Object.assign({}, v, { kind: "PROVIDER", trades: st8.trades, businessType: st8.businessType, zones: st8.zones || "", locale: S.lang })).then(function (r) {
              st8.request = r; st8.step = 3; draw();
            }).catch(function (e) { b.disabled = false; err.textContent = errMsg(e); err.classList.remove("hidden"); err.scrollIntoView({ block: "center" }); });
          };
          body.appendChild(Public.navRow(function () { st8.values = Object.assign(st8.values, f.get()); st8.step = 1; draw(); }, function (ev) { go(ev && ev.currentTarget ? ev.currentTarget : this); }, t("Recevoir mon code")));
        } else {
          body.appendChild(Public.codeStep(st8.request, function (r) { Public._redraw = null; Public.enterAfterSignup(r, "referencing"); }, function () { st8.step = 2; draw(); }));
        }
        Public.wide(t("Se référencer comme artisan"), steps, st8.step, body);
      };
      draw();
    }).catch(function (e) { Public.wide(t("Se référencer comme artisan"), steps, 0, h("div", { class: "alert bad" }, errMsg(e))); });
  },
  forgot: function () {
    formModal(t("Mot de passe oublié"), [{ k: "email", l: "E-mail", t: "email", req: true }], {}, function (v) {
      return apiP("auth.requestReset", { email: v.email }).then(function (r) { toast(r.message, "good"); });
    }, { submitLabel: t("Recevoir un lien"), size: "sm", intro: t("Un lien à usage unique vous sera envoyé si un compte actif correspond.") });
  },
  invite: function (token) {
    Public.frame(t("Rejoindre DarPilot"), "", h("div", { class: "loading" }, t("Vérification de l'invitation…")));
    apiP("invite.info", { token: token }).then(function (info) {
      const fields = info.existingAccount ? [{ k: "currentPassword", l: "Mot de passe de votre compte existant", t: "password", req: true }] :
        [{ k: "displayName", l: "Nom affiché", def: info.displayName, req: true }, { k: "password", l: "Choisissez un mot de passe", t: "password", req: true, help: "10 caractères minimum, avec lettres et chiffres.", ac: "new-password" },
          { k: "password2", l: "Confirmez le mot de passe", t: "password", req: true, ac: "new-password" }];
      const f = buildForm(fields, {}), err = h("div", { class: "alert bad hidden" });
      const go = h("button", { class: "btn primary lg", type: "submit", style: { width: "100%", justifyContent: "center" } }, t("Accepter l'invitation"));
      f.el.appendChild(h("div", { class: "full" }, go));
      f.el.addEventListener("submit", function (ev) {
        ev.preventDefault(); const v = f.get(); let m = f.validate();
        if (!m && !info.existingAccount && v.password !== v.password2) m = t("Les mots de passe ne correspondent pas.");
        if (m) { err.textContent = m; err.classList.remove("hidden"); return; }
        go.disabled = true;
        apiP("invite.accept", { token: token, displayName: v.displayName, password: v.password, currentPassword: v.currentPassword }).then(function (r) {
          Public.frame(t("Invitation acceptée"), r.message, h("a", { class: "btn primary", href: (S.boot.appUrl || "") + "?", target: "_top", onclick: function (ev) { ev.preventDefault(); S.boot.mode = "app"; Public.login(); } }, t("Se connecter")));
        }).catch(function (e) { err.textContent = errMsg(e); err.classList.remove("hidden"); go.disabled = false; });
      });
      Public.frame(t("Rejoindre DarPilot"), "", h("div", null, h("div", { class: "alert info" }, kv([["Organisation", info.organizationName], ["Rôle", roleLabel(info.role)], ["E-mail", info.email], ["Expire le", fmtDT(info.expiresAt)]])), err, f.el));
    }).catch(function (e) { Public.frame(t("Invitation"), "", h("div", null, h("div", { class: "alert bad" }, errMsg(e)), btn(t("Aller à la connexion"), function () { Public.login(); }))); });
  },
  reset: function (token) {
    const f = buildForm([{ k: "password", l: "Nouveau mot de passe", t: "password", req: true, help: "10 caractères minimum, avec lettres et chiffres.", ac: "new-password" }, { k: "password2", l: "Confirmation", t: "password", req: true, ac: "new-password" }]);
    const err = h("div", { class: "alert bad hidden" }), go = h("button", { class: "btn primary lg", type: "submit", style: { width: "100%", justifyContent: "center" } }, t("Enregistrer le mot de passe"));
    f.el.appendChild(h("div", { class: "full" }, go));
    f.el.addEventListener("submit", function (ev) {
      ev.preventDefault(); const v = f.get(); let m = f.validate(); if (!m && v.password !== v.password2) m = t("Les mots de passe ne correspondent pas.");
      if (m) { err.textContent = m; err.classList.remove("hidden"); return; }
      go.disabled = true;
      apiP("auth.resetPassword", { token: token, password: v.password }).then(function (r) { S.boot.mode = "app"; Public.login(); toast(r.message, "good"); })
        .catch(function (e) { err.textContent = errMsg(e); err.classList.remove("hidden"); go.disabled = false; });
    });
    Public.frame(t("Définir votre mot de passe"), t("Ce lien est personnel et utilisable une seule fois."), h("div", null, err, f.el));
  },
  /* ----------------------------- Portail voyageur ----------------------------- */
  guest: function (token) {
    const app = clear($("app"));
    const wrap = h("div", { class: "guest-wrap" }, h("div", { class: "loading" }, t("Chargement…")));
    app.appendChild(wrap);
    const load = function () {
      apiP("guest.portal.get", { token: token }).then(function (g) {
        clear(wrap);
        const langSel = h("select", { class: "lang", onchange: function (e) { setLang(e.target.value); load(); } }, langOpts().map(function (l) { return h("option", { value: l[0] }, l[1]); })); langSel.value = S.lang;
        wrap.appendChild(h("div", { class: "page-head" }, h("div", null, h("h2", null, g.propertyName), h("p", null, g.city + (g.address ? " — " + g.address : ""))), langSel));
        wrap.appendChild(panel("Votre séjour", kv([["Arrivée", fmtDate(g.checkIn) + " · " + t("à partir de") + " " + g.checkInTime], ["Départ", fmtDate(g.checkOut) + " · " + t("avant") + " " + g.checkOutTime], ["Voyageurs", g.guestCount], ["Réservation au nom de", g.guestName]])));
        wrap.appendChild(panel("Consignes d'arrivée", h("div", null, h("p", { style: { whiteSpace: "pre-wrap" } }, g.arrivalInstructions || t("Les consignes vous seront communiquées par votre hôte.")),
          g.accessInstructions ? h("div", { class: "alert info", style: { whiteSpace: "pre-wrap" } }, g.accessInstructions) : h("p", { class: "muted small" }, t("Les codes d'accès seront visibles à partir du") + " " + fmtDate(g.accessAvailableFrom) + "."))));
        if (g.houseRules) wrap.appendChild(panel("Règlement intérieur", h("p", { style: { whiteSpace: "pre-wrap" } }, g.houseRules)));
        if (g.departureInstructions) wrap.appendChild(panel("Consignes de départ", h("p", { style: { whiteSpace: "pre-wrap" } }, g.departureInstructions)));
        // Fiches voyageurs
        const rows = g.guests.slice();
        while (rows.length < g.guestCount) rows.push({});
        const forms = rows.map(function (x, i) {
          const f = buildForm([{ k: "lastName", l: "Nom", req: true }, { k: "firstName", l: "Prénom" }, { k: "nationality", l: "Nationalité" },
            { k: "idType", l: "Type de pièce", t: "select", opts: g.idTypes.map(function (x2) { return [x2, st(x2)]; }) }, { k: "idRef", l: "Numéro de pièce", help: "Seuls les derniers caractères sont conservés, sauf obligation légale." }].concat(g.policeForms ? [
            { k: "birthDate", l: "Date de naissance", t: "date" }, { k: "birthPlace", l: "Lieu de naissance" }, { k: "homeAddress", l: "Domicile habituel", full: true, help: "Demandé aux voyageurs de nationalité étrangère (fiche individuelle de police)." }] : []), x);
          f.guestId = x.guestId; f.docCount = x.documentCount || 0; f.index = i; return f;
        });
        const formsBox = h("div");
        forms.forEach(function (f) {
          const up = f.guestId ? btn(t("Joindre la pièce d'identité") + (f.docCount ? " (" + f.docCount + ")" : ""), function () {
            pickFiles({ accept: "image/*,application/pdf", capture: "environment" }).then(function (files) {
              if (!files.length) return; return fileToPayload(files[0]).then(function (pl) { return apiP("guest.portal.upload", Object.assign(pl, { token: token, guestId: f.guestId })); }).then(function () { toast(t("Document transmis."), "good"); load(); });
            }).catch(showErr);
          }, "sm") : h("span", { class: "small muted" }, t("Enregistrez d'abord la fiche pour joindre un document."));
          formsBox.appendChild(h("div", { class: "panel", style: { boxShadow: "none" } }, h("div", { class: "panel-head" }, h("h3", null, t("Voyageur") + " " + (f.index + 1)), up), f.el));
        });
        const save = btn(t("Enregistrer les informations"), function () {
          const bad = forms.map(function (f) { return f.validate(); }).filter(Boolean)[0]; if (bad) { toast(bad, "bad"); return; }
          save.disabled = true;
          apiP("guest.portal.save", { token: token, guests: forms.map(function (f) { return Object.assign({ guestId: f.guestId }, f.get()); }) }).then(function () { toast(t("Informations enregistrées."), "good"); load(); }).catch(function (e) { showErr(e); save.disabled = false; });
        }, "primary");
        wrap.appendChild(panel("Informations des voyageurs", h("div", null, h("p", { class: "muted small" }, t("Ces informations sont transmises de façon sécurisée à votre hôte et supprimées après la durée légale de conservation.")), formsBox, save)));
        // Signalement
        wrap.appendChild(panel("Signaler un problème", h("div", null, h("p", { class: "muted small" }, t("Une fuite, une panne, un souci d'accès ? Prévenez votre hôte.")), btn(t("Signaler un problème"), function () {
          formModal(t("Signaler un problème"), [{ k: "category", l: "Catégorie", t: "select", req: true, opts: g.incidentCategories.map(function (c) { return [c, st(c)]; }) }, { k: "description", l: "Description", t: "textarea", req: true }], {},
            function (v) { return apiP("guest.portal.incident", Object.assign({ token: token }, v)); }, { success: "Votre signalement a été transmis." });
        }))));
      }).catch(function (e) { clear(wrap).appendChild(h("div", { class: "alert bad" }, errMsg(e))); });
    };
    load();
  }
};
</script>
