<style>
/* Rubban — assistant d'aide (bulle en bas à droite) */
#rb-fab{position:fixed;bottom:18px;inset-inline-end:18px;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;z-index:9000;padding:0;
  background:radial-gradient(circle at 30% 25%,#24456B,#10233C 70%);box-shadow:0 8px 24px rgba(16,35,60,.35),0 0 0 3px #fff;display:grid;place-items:center;transition:transform .15s}
#rb-fab:hover{transform:translateY(-2px) scale(1.04)}
#rb-fab:focus-visible{outline:3px solid #E9B341;outline-offset:3px}
#rb-fab .rb-dot{position:absolute;top:4px;inset-inline-end:4px;width:12px;height:12px;border-radius:50%;background:#2BB673;border:2px solid #fff}
#rb-fab .rb-hint{position:absolute;bottom:68px;inset-inline-end:0;background:#10233C;color:#fff;font:600 12px/1.3 system-ui,sans-serif;padding:7px 10px;border-radius:10px;white-space:nowrap;
  box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none;opacity:0;transform:translateY(4px);transition:all .25s}
#rb-fab:hover .rb-hint,#rb-fab.rb-hello .rb-hint{opacity:1;transform:none}
#rb-panel{position:fixed;bottom:90px;inset-inline-end:18px;width:370px;max-width:calc(100vw - 24px);height:560px;max-height:calc(100vh - 110px);z-index:9001;background:#fff;border-radius:18px;
  box-shadow:0 18px 50px rgba(16,35,60,.32);display:flex;flex-direction:column;overflow:hidden;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1d2b3a;
  opacity:0;transform:translateY(12px) scale(.98);pointer-events:none;transition:all .18s}
#rb-panel.open{opacity:1;transform:none;pointer-events:auto}
.rb-head{background:linear-gradient(135deg,#10233C,#24456B);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.rb-head .rb-av{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex-shrink:0}
.rb-head b{font-size:16px;letter-spacing:.2px}.rb-head b span{color:#E9B341;font-weight:600;margin-inline-start:6px;font-size:13px}
.rb-head small{display:block;opacity:.8;font-size:12px}.rb-head .rb-x{margin-inline-start:auto;background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:4px 6px;border-radius:8px}
.rb-head .rb-x:hover{background:rgba(255,255,255,.12)}
.rb-body{flex:1;overflow-y:auto;padding:14px;background:#F4F6FA;display:flex;flex-direction:column;gap:10px}
.rb-msg{max-width:88%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.rb-bot{background:#fff;border:1px solid #E1E6EE;align-self:flex-start;border-start-start-radius:4px}
.rb-me{background:#3D4FD1;color:#fff;align-self:flex-end;border-start-end-radius:4px}
.rb-msg h5{margin:0 0 6px;font-size:14px;color:#10233C}.rb-msg ol,.rb-msg ul{margin:4px 0;padding-inline-start:20px}.rb-msg li{margin:3px 0}
.rb-note{font-size:12px;color:#8A6A12;background:#FFF6DD;border:1px solid #F1DFA6;border-radius:10px;padding:6px 9px;align-self:stretch}
.rb-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rb-chip{border:1px solid #CBD3F5;background:#ECEEFC;color:#2B3AB0;border-radius:16px;padding:5px 10px;font-size:12.5px;cursor:pointer}
.rb-chip:hover{background:#DDE1FB}.rb-chip.go{background:#10233C;color:#fff;border-color:#10233C}
.rb-typing{display:flex;gap:4px;padding:12px}.rb-typing i{width:7px;height:7px;border-radius:50%;background:#9AA7BD;animation:rbb 1s infinite}
.rb-typing i:nth-child(2){animation-delay:.15s}.rb-typing i:nth-child(3){animation-delay:.3s}
@keyframes rbb{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}
.rb-foot{border-top:1px solid #E1E6EE;padding:10px;background:#fff}
.rb-form{display:flex;gap:8px;align-items:flex-end}
.rb-form textarea{flex:1;resize:none;border:1px solid #CFD7E3;border-radius:12px;padding:9px 11px;font:inherit;max-height:96px;min-height:40px}
.rb-form textarea:focus{outline:2px solid #3D4FD1;border-color:transparent}
.rb-send{width:40px;height:40px;border-radius:12px;border:0;background:#3D4FD1;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.rb-send:disabled{opacity:.5;cursor:default}
.rb-legal{font-size:11px;color:#7A8699;margin-top:6px;text-align:center}
@media (max-width:520px){#rb-panel{inset-inline-end:8px;bottom:84px;height:calc(100vh - 100px)}#rb-fab{bottom:14px;inset-inline-end:14px}}
@media print{#rb-fab,#rb-panel{display:none!important}}
</style>
<script>
"use strict";
/**
 * Rubban (رُبّان, « le pilote ») — assistant d'aide 24 h/24.
 * Mode Guide : recherche locale dans la base de connaissances servie par le serveur (aucune donnée client).
 * Mode IA : la question est transmise au serveur (route assistant.ask), qui seul détient la clé du service d'IA.
 * Tout le contenu est inséré avec textContent (aucun innerHTML).

const Rubban = (function () {
  const R = { kb: null, kbAuth: false, aiEnabled: false, roles: [], history: [], busy: false, fab: null, panel: null, body: null, input: null, legal: null };
  const STOP = ["le", "la", "les", "un", "une", "des", "de", "du", "d", "l", "et", "ou", "a", "au", "aux", "en", "dans", "pour", "par", "sur", "avec", "est", "je", "j", "tu", "il", "on", "nous", "vous",
    "mon", "ma", "mes", "ton", "ta", "son", "sa", "ses", "ce", "cet", "cette", "qui", "que", "quoi", "comment", "faire", "fait", "faut", "peux", "peut", "veux", "veut", "comme", "moi", "ne", "pas",

  const SYN = { resa: "reservation", resas: "reservation", reservations: "reservation", reserver: "reservation", booking: "reservation", sejour: "reservation", nettoyage: "menage", cleaning: "menage",
    femme: "menage", appart: "bien", appartement: "bien", logement: "bien", logements: "bien", villa: "bien", riad: "bien", biens: "bien", maison: "bien", property: "bien", proprio: "proprietaire",
    mdp: "mot", password: "mot", motdepasse: "mot", artisan: "prestataire", artisans: "prestataire", plombier: "prestataire", electricien: "prestataire", prestataires: "prestataire",
    invoice: "facture", factures: "facture", quote: "devis", agences: "agence", agency: "agence", locataires: "locataire", tenant: "locataire", lease: "bail", baux: "bail", loyer: "loyer", loyers: "loyer",
    paye: "paiement", payment: "paiement", encaisser: "paiement", panne: "incident", fuite: "incident", casse: "incident", probleme: "incident", gardien: "gardien", concierge: "gardien",
    supprimer: "supprimer", effacer: "supprimer", photos: "photo", images: "photo", image: "photo", paie: "payer", payes: "payer", inviter: "inviter", invitation: "inviter", utilisateur: "utilisateur", utilisateurs: "utilisateur", user: "utilisateur",

  const PUBLIC_IDS = ["login", "activate", "forgot", "install-phone", "error"];

  function prepare(kb) {
    (kb.articles || []).forEach(function (a) { a._t = tokens(a.t); a._k = tokens(a.k + " " + a.t); a._b = tokens(a.s.join(" ")); });
    R.kb = kb; R.aiEnabled = !!kb.aiEnabled; R.roles = kb.roles || [];
  }
  function allowed(a) {
    if (!S.me) return PUBLIC_IDS.indexOf(a.id) >= 0;
    return a.r.indexOf("*") >= 0 || a.r.some(function (r) { return R.roles.indexOf(r) >= 0; });
  }
  function score(a, q) {
    let s = 0;
    q.forEach(function (w) {
      const pre = w.length >= 4 ? w.slice(0, Math.min(6, w.length)) : null;
      const hit = function (list, exact, partial) { if (list.indexOf(w) >= 0) return exact; if (pre && list.some(function (x) { return x.indexOf(pre) === 0 || (x.length >= 4 && w.indexOf(x.slice(0, 6)) === 0); })) return partial; return 0; };
      s += Math.max(hit(a._t, 4, 2), hit(a._k, 3, 1.5)) + hit(a._b, 1, 0.4);

  }
  function suggestions() {
    const order = S.me ? (S.me.isSuper ? ["admin-org", "providers-admin", "admin-sub", "invite"] : R.roles.indexOf("OWNER") >= 0 ? ["property-create", "agency-create", "agency-manage", "pareto"]
      : R.roles.indexOf("CLEANER") >= 0 ? ["cleaning-do", "cleaning-validate", "incident", "password"] : R.roles.indexOf("ARTISAN") >= 0 ? ["quote", "workorder", "invoice", "password"]
      : R.roles.indexOf("GUARD") >= 0 ? ["checkin", "incident", "calendar", "password"] : R.roles.indexOf("TENANT") >= 0 ? ["tenant-space", "incident", "password", "notifications"]
      : ["resv-create", "cleaning-create", "incident", "finance"]) : ["activate", "forgot", "login", "install-phone"];

  }

  /* ---------- Interface ---------- */
  const SVG_NS = "http://www.w3.org/2000/svg";

    add("line", { x1: 32, y1: 6, x2: 32, y2: 14, stroke: "#E9B341", "stroke-width": 3, "stroke-linecap": "round" });
    add("circle", { cx: 32, cy: 6, r: 4, fill: "#E9B341" });
    add("rect", { x: 4, y: 26, width: 6, height: 14, rx: 3, fill: "#E9B341" });
    add("rect", { x: 54, y: 26, width: 6, height: 14, rx: 3, fill: "#E9B341" });
    add("rect", { x: 9, y: 14, width: 46, height: 38, rx: 13, fill: "#F4F6FA", stroke: "#E9B341", "stroke-width": 2 });
    add("rect", { x: 15, y: 21, width: 34, height: 23, rx: 9, fill: "#10233C" });
    add("circle", { cx: 25, cy: 31, r: 4.2, fill: "#7FE0FF" });
    add("circle", { cx: 39, cy: 31, r: 4.2, fill: "#7FE0FF" });
    add("circle", { cx: 26.3, cy: 29.7, r: 1.3, fill: "#fff" });
    add("circle", { cx: 40.3, cy: 29.7, r: 1.3, fill: "#fff" });
    add("path", { d: "M25 38 Q32 42.5 39 38", stroke: "#E9B341", "stroke-width": 2.4, fill: "none", "stroke-linecap": "round" });

  }
  function el() { return h.apply(null, arguments); }

  function goTo(route) { if (!S.me) return; NAV_HASH.v = route; if (window.innerWidth < 700) toggle(false); }
  function chipsFor(list, label) {
    if (!list.length) return null;
    return el("div", null, label ? el("div", { class: "small", style: { marginTop: "8px", color: "#6B778A", fontSize: "12px" } }, label) : null,
      el("div", { class: "rb-chips" }, list.map(function (a) { return el("button", { type: "button", class: "rb-chip", onclick: function () { showArticle(a); } }, a.t); })));
  }
  function articleNodes(a) {
    const ol = el("ol"); a.s.forEach(function (x) { ol.appendChild(el("li", null, x)); });
    const acts = el("div", { class: "rb-chips" });
    if (a.go && S.me) acts.appendChild(el("button", { type: "button", class: "rb-chip go", onclick: function () { goTo(a.go); } }, "➜ " + t("Ouvrir la page")));
    return [el("h5", null, a.t), ol, acts.children.length ? acts : null];
  }
  function showArticle(a) { bubble("rb-bot", articleNodes(a)); remember("assistant", a.t + " : " + a.s.join(" ")); }
  function remember(role, content) { R.history.push({ role: role, content: String(content).slice(0, 1200) }); R.history = R.history.slice(-8); }
  function aiNodes(text) {
    // Mise en forme légère d'un texte brut : listes numérotées ou à puces, gras ** retiré.
    const out = [], lines = String(text).replace(/\*\*/g, "").split(/\n+/);
    let list = null;
    lines.forEach(function (l) {
      const m = l.match(/^\s*(?:\d+[.)]|[-•*])\s+(.*)$/);
      if (m) { if (!list) { list = el(/^\s*\d/.test(l) ? "ol" : "ul"); out.push(list); } list.appendChild(el("li", null, m[1])); }
      else if (l.trim()) { list = null; out.push(el("div", null, l.trim())); }
    });
    return out;
  }
  function guideAnswer(q) {
    const hits = search(q, 4);
    if (!hits.length) {
      bubble("rb-bot", [el("div", null, t("Je n'ai pas trouvé de réponse précise. Essayez avec d'autres mots (par exemple : « créer une réservation », « valider un ménage »), ou choisissez un sujet :")), chipsFor(suggestions())]);
      return;
    }
    const b = bubble("rb-bot", articleNodes(hits[0]));
    const more = chipsFor(hits.slice(1), t("Voir aussi")); if (more) b.appendChild(more);
    remember("assistant", hits[0].t + " : " + hits[0].s.join(" ")); scrollEnd();
  }
  function typing(on) {
    if (on) { R.typingEl = el("div", { class: "rb-msg rb-bot rb-typing", "aria-label": t("Rubban écrit…") }, [el("i"), el("i"), el("i")]); R.body.appendChild(R.typingEl); scrollEnd(); }
    else if (R.typingEl) { R.typingEl.remove(); R.typingEl = null; }

    const hist = R.history.slice(-6);
    remember("user", q);
    api("assistant.ask", { question: q.slice(0, 600), history: hist, page: S.route || "", lang: S.lang }).then(function (r) {
      typing(false);
      if (r.mode === "ai") {
        const b = bubble("rb-bot", aiNodes(r.answer));
        const rel = chipsFor(search(q, 2), t("Pages utiles")); if (rel) b.appendChild(rel);
        remember("assistant", r.answer); scrollEnd();
      } else { if (r.notice) R.body.appendChild(el("div", { class: "rb-note" }, t(r.notice))); guideAnswer(q); }
    }).catch(function () { typing(false); guideAnswer(q); }).then(function () { R.busy = false; R.send.disabled = false; R.input.focus(); });
  }
  function loadKb() {
    const auth = !!(S.me && S.token);
    if (R.kb && R.kbAuth === auth) return Promise.resolve();
    return (auth ? api("assistant.kb") : apiP("assistant.kb")).then(function (kb) { prepare(kb); R.kbAuth = auth; R.legal.textContent = R.aiEnabled && auth
      ? t("Réponses générées par une IA à partir de l'aide ImmoPilot : vérifiez les points importants. N'indiquez aucune donnée personnelle.")
      : t("Mode guide : réponses issues de l'aide officielle d'ImmoPilot."); });
  }
  function welcome() {
    clear(R.body);
    const name = S.me && S.me.displayName ? " " + String(S.me.displayName).split(" ")[0] : "";
    bubble("rb-bot", [el("div", null, t("Salam") + name + " ! " + t("Je suis Rubban (رُبّان, « le pilote »), votre copilote ImmoPilot. Posez-moi votre question : je vous guide pas à pas.")),
      chipsFor(suggestions(), t("Questions fréquentes"))]);
  }
  function toggle(open) {
    const want = open === undefined ? !R.panel.classList.contains("open") : open;
    R.panel.classList.toggle("open", want); R.fab.setAttribute("aria-expanded", want ? "true" : "false"); R.fab.classList.remove("rb-hello");

        .catch(function () { clear(R.body); bubble("rb-bot", [el("div", null, t("L'aide n'a pas pu être chargée. Vérifiez votre connexion puis réessayez."))]); });
    }
  }

    if (R.fab || (S.boot && S.boot.mode === "guest")) return;

      [robot(40), el("span", { class: "rb-dot", "aria-hidden": "true" }), el("span", { class: "rb-hint" }, t("Besoin d'aide ? Demandez à Rubban"))]);
    R.body = el("div", { class: "rb-body", role: "log", "aria-live": "polite" });
    R.input = el("textarea", { rows: 1, maxlength: 600, placeholder: t("Votre question…"), "aria-label": t("Votre question"),

    R.panel = el("section", { id: "rb-panel", role: "dialog", "aria-label": "Rubban", "aria-modal": "false" }, [
      el("header", { class: "rb-head" }, [av, el("div", null, [el("b", null, ["Rubban", el("span", null, "رُبّان")]), el("small", null, t("Votre copilote ImmoPilot · 24 h/24, 7 j/7"))]),
        el("button", { type: "button", class: "rb-x", "aria-label": t("Fermer"), onclick: function () { toggle(false); } }, "×")]),
      R.body, el("div", { class: "rb-foot" }, [el("div", { class: "rb-form" }, [R.input, R.send]), R.legal])]);

    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && R.panel.classList.contains("open")) toggle(false); });
    try { if (!lstore("rb_seen")) { R.fab.classList.add("rb-hello"); setTimeout(function () { R.fab.classList.remove("rb-hello"); }, 6000); lstore("rb_seen", "1"); } } catch (e) { /* stockage indisponible */ }
