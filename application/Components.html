        pager.appendChild(h("span", { class: "actions" }, h("button", { class: "btn sm", disabled: r.page <= 1, onclick: function () { state.page--; load(); } }, "‹"), h("button", { class: "btn sm", disabled: r.page >= pages, onclick: function () { state.page++; load(); } }, "›")));

/* ------------------------------ graphiques ------------------------------ */
const PALETTE = { primary: "#3D4FD1", palm: "#1E7A55", saffron: "#D9A21B", clay: "#B4432F", grey: "#9AA7B8", navy: "#10233C" };
/* ---------- Thème clair / sombre : choix mémorisé sur l'appareil ; par défaut, réglage du système ---------- */
function themeCurrent() {
  const saved = lstore("ip_theme");
  if (saved === "dark" || saved === "light") return saved;
  try { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { return "light"; }
}
function themeApply(mode) {
  document.documentElement.setAttribute("data-theme", mode);
  // Couleurs des graphiques adaptées au fond.
  PALETTE.navy = mode === "dark" ? "#C9D3E1" : "#10233C"; PALETTE.primary = mode === "dark" ? "#8291FF" : "#3D4FD1"; PALETTE.palm = mode === "dark" ? "#4CC38A" : "#1E7A55";
  if (window.Chart && window.Chart.defaults) { Chart.defaults.color = mode === "dark" ? "#C9D3E1" : "#5E6B7D"; Chart.defaults.borderColor = mode === "dark" ? "rgba(255,255,255,.08)" : "rgba(0,0,0,.08)"; }
}
function themeToggle() {
  const next = themeCurrent() === "dark" ? "light" : "dark";
  lstore("ip_theme", next); themeApply(next);
  document.querySelectorAll(".theme-btn").forEach(function (b) { themeButtonSync(b); });
  if (S.me && window.App && S.route) App.go(S.route); // redessine les graphiques
}
function themeButtonSync(b) {
  const dark = themeCurrent() === "dark";
  b.textContent = dark ? "☀️" : "🌙";
  b.setAttribute("aria-label", dark ? t("Passer en mode clair") : t("Passer en mode sombre"));
  b.title = b.getAttribute("aria-label");
}
function themeButton() { const b = h("button", { type: "button", class: "theme-btn", onclick: themeToggle }); themeButtonSync(b); return b; }
themeApply(themeCurrent());
try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { if (!lstore("ip_theme")) { themeApply(themeCurrent()); document.querySelectorAll(".theme-btn").forEach(themeButtonSync); } }); } catch (e) { /* navigateur ancien */ }
function chart(canvasParent, config) {
  if (!window.Chart) { canvasParent.appendChild(h("div", { class: "muted small" }, t("Graphique indisponible (bibliothèque Chart.js non chargée)."))); return null; }
  const c = h("canvas"); clear(canvasParent).appendChild(h("div", { class: "chart-box" }, c));
  config.options = Object.assign({ responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", rtl: S.lang === "ar" } } }, config.options || {});
  const ch = new Chart(c.getContext("2d"), config); S.charts.push(ch); return ch;
}
function destroyCharts() { S.charts.forEach(function (c) { try { c.destroy(); } catch (e) { /* déjà détruit */ } }); S.charts = []; }

/* ------------------------------ fichiers ------------------------------ */
function pickFiles(opts) {
  opts = opts || {};
  return new Promise(function (res) {
    const i = h("input", { type: "file", accept: opts.accept || "image/*,application/pdf", multiple: opts.multiple ? true : null, capture: opts.capture || null, style: { display: "none" } });
    i.addEventListener("change", function () { res(Array.from(i.files || [])); i.remove(); });
    document.body.appendChild(i); i.click();
  });
}
/** Lit un fichier ; les photos sont réduites (1600 px, JPEG) côté client pour limiter le volume transféré. */
function fileToPayload(file) {
  return new Promise(function (res, rej) {
    if (file.size > 12 * 1024 * 1024) { rej({ message: t("Fichier trop volumineux.") }); return; }
    const r = new FileReader();
    r.onerror = function () { rej({ message: t("Lecture du fichier impossible.") }); };
    r.onload = function () {
      const dataUrl = r.result;
      if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { res({ fileName: file.name, mimeType: file.type, base64: String(dataUrl).split(",")[1] }); return; }
      const img = new Image();
      img.onload = function () {
        const max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = h("canvas", { width: Math.round(img.width * sc), height: Math.round(img.height * sc) });
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res({ fileName: file.name.replace(/\.[^.]+$/, "") + ".jpg", mimeType: "image/jpeg", base64: cv.toDataURL("image/jpeg", 0.82).split(",")[1] });
      };
      img.onerror = function () { res({ fileName: file.name, mimeType: file.type, base64: String(dataUrl).split(",")[1] }); };
      img.src = dataUrl;
    };
    r.readAsDataURL(file);
  });
}
function uploadFiles(files, ownerType, ownerId, category) {
  const ids = [];
  return files.reduce(function (p, f) {
    return p.then(function () { return fileToPayload(f); }).then(function (pl) { return api("doc.upload", Object.assign(pl, { ownerType: ownerType, ownerId: ownerId, category: category })); }).then(function (r) { ids.push(r.documentId); });
  }, Promise.resolve()).then(function () { if (ids.length) toast(ids.length + " " + t("fichier(s) envoyé(s)."), "good"); return ids; });
}
function b64ToBlob(b64, mime) { const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); return new Blob([arr], { type: mime }); }
/** Téléchargement d'un contenu renvoyé par le serveur (après contrôle des droits). */
function download(payload) {
  const blob = payload.base64 ? b64ToBlob(payload.base64, payload.mimeType) : new Blob(["﻿" + payload.content], { type: (payload.mimeType || "text/plain") + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: payload.fileName || "fichier", target: "_blank", rel: "noopener" });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
}
function openDoc(documentId) { return api("doc.get", { documentId: documentId }).then(download).catch(showErr); }
const IMG_CACHE = {};
function docImg(documentId) {
  const img = h("img", { alt: "", loading: "lazy" });
  (IMG_CACHE[documentId] ? Promise.resolve(IMG_CACHE[documentId]) : api("doc.get", { documentId: documentId }).then(function (d) { IMG_CACHE[documentId] = /^image\//.test(d.mimeType) ? URL.createObjectURL(b64ToBlob(d.base64, d.mimeType)) : ""; return IMG_CACHE[documentId]; }))
    .then(function (u) { if (u) img.src = u; else img.replaceWith(h("div", { class: "empty" }, "PDF")); }).catch(function () { img.alt = t("Accès refusé"); });
  return img;
}
function gallery(docs, opts) {
  opts = opts || {};
  if (!docs || !docs.length) return h("div", { class: "empty" }, t("Aucun fichier."));
  return h("div", { class: "gallery" }, docs.map(function (d) {
    const isImg = /^image\//.test(d.mimeType || "") || /\.(jpe?g|png|webp)$/i.test(d.fileName || "");
    return h("figure", null, isImg ? (function () { const im = docImg(d.documentId); im.addEventListener("click", function () { openDoc(d.documentId); }); return im; })() :
      h("div", { class: "empty", style: { cursor: "pointer" }, onclick: function () { openDoc(d.documentId); } }, "📄"), h("figcaption", { title: d.fileName }, (d.category ? st(d.category) + " · " : "") + d.fileName));
  }));
}
function docList(docs) {
  return table([{ l: "Fichier", k: "fileName" }, { l: "Catégorie", f: function (d) { return st(d.category); } }, { l: "Ajouté le", dt: true, k: "createdAt" }, { l: "", f: function (d) { return btn(t("Télécharger"), function () { openDoc(d.documentId); }, "sm"); } }], docs, { empty: "Aucun document." });
}

/* ------------------------------ signature tactile ------------------------------ */
function signaturePad() {
  const cv = h("canvas", { class: "sig", width: 600, height: 160 }); let drawing = false, dirty = false;
  const ctx = cv.getContext("2d"); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.strokeStyle = "#10233C";
  const pos = function (e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener("pointerdown", function (e) { drawing = true; dirty = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", function (e) { if (!drawing) return; const p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); });
  cv.addEventListener("pointerup", function () { drawing = false; });
  const wrap = h("div", null, cv, h("button", { type: "button", class: "btn sm ghost", onclick: function () { ctx.clearRect(0, 0, cv.width, cv.height); dirty = false; } }, t("Effacer")));
  wrap.getPayload = function () { return dirty ? { fileName: "signature.png", mimeType: "image/png", base64: cv.toDataURL("image/png").split(",")[1] } : null; };
  return wrap;
}
