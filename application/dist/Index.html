<!DOCTYPE html>
<!-- IMMOPILOT_BUNDLE : interface complète en un seul fichier (Index). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ImmoPilot</title>
<!-- ===== Styles.html ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ImmoPilot — système visuel.
   Bleu marine pour la navigation, bleu Majorelle pour l'action, vert palmeraie / safran / argile pour les états.
   Une seule note décorative : le motif d'étoile à huit branches (zellige) en pied de barre latérale. */
:root{
  --navy:#10233C; --navy-2:#183152; --navy-3:#24456B; --nav-ink:#C9D6E6;
  --primary:#3D4FD1; --primary-ink:#fff; --primary-soft:#ECEEFC;
  --palm:#1E7A55; --palm-soft:#E4F3EC; --saffron:#9A6A0B; --saffron-soft:#FBF1DC; --clay:#B4432F; --clay-soft:#FBE9E5;
  --ink:#1A2433; --muted:#5E6B7D; --line:#E2E7EF; --bg:#F4F6FA; --surface:#fff; --surface-2:#F9FAFC;
  --line-2:#EEF1F5; --hover:#F7F8FD; --vital:#F5F6FE; --tag-bg:#EEF1F6; --tag-ink:#3B4A5E; --ctl-border:#D3DAE5; --ctl-border-h:#C6CEDB;
  --spin:#C8D0DC; --cal-we:#F7F8FB; --alert-bad-b:#EFC7BE; --alert-bad-ink:#7E2A1B; --alert-info-b:#D2D7FA; --alert-warn-b:#F0DDB0; --alert-warn-ink:#6B4A06;
  --danger-b:#EBC5BC; --field-bg:#fff; color-scheme:light;
  --r-panel:10px; --r-ctl:6px; --shadow:0 1px 2px rgba(16,35,60,.06),0 4px 16px rgba(16,35,60,.05);
  --font:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif}
a{color:var(--primary);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12px} .right{text-align:end} .nowrap{white-space:nowrap}

/* ---------- Coque ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:248px;flex-shrink:0;background:var(--navy);color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.sidebar::after{content:"";position:absolute;inset-inline:0;bottom:0;height:180px;pointer-events:none;opacity:.10;
  background:
   radial-gradient(circle at 50% 50%,transparent 9px,#fff 10px,transparent 11px) 0 0/36px 36px,
   conic-gradient(from 22.5deg at 50% 50%,#fff 0 12.5%,transparent 0 25%,#fff 0 37.5%,transparent 0 50%,#fff 0 62.5%,transparent 0 75%,#fff 0 87.5%,transparent 0) 0 0/36px 36px;
  -webkit-mask:linear-gradient(to top,#000 20%,transparent);mask:linear-gradient(to top,#000 20%,transparent)}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px}
.brand-mark{width:38px;height:38px;border-radius:9px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:700;letter-spacing:-.5px}
.brand b{display:block;color:#fff;font-size:16px}.brand small{color:#93A7C0;font-size:12px}
.nav{flex:1;overflow-y:auto;padding:4px 10px 24px;position:relative;z-index:1}
.nav-group{font-size:11px;color:#7F95B0;padding:14px 12px 6px;letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:10px;color:var(--nav-ink);padding:9px 12px;border-radius:8px;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--navy-2);color:#fff}
.nav a.active{background:var(--navy-3);color:#fff;box-shadow:inset 3px 0 0 #8E9BFF}
html[dir=rtl] .nav a.active{box-shadow:inset -3px 0 0 #8E9BFF}
.nav .ico{width:18px;text-align:center;opacity:.9}
.nav .badge{margin-inline-start:auto;background:#8E9BFF;color:var(--navy);font-size:11px;border-radius:10px;padding:0 7px;font-weight:700}
.sidebar-foot{padding:12px 20px 16px;font-size:11px;color:#7F95B0;position:relative;z-index:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{font-size:20px;margin:0;font-weight:600}
.topbar .spacer{flex:1}
.menu-btn{display:none;background:none;border:0;font-size:22px;padding:4px 8px;cursor:pointer}
.user-chip{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:4px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700}
.user-chip small{display:block;color:var(--muted);font-size:11px;text-align:start}
.content{padding:24px 28px 48px;max-width:1360px;width:100%}
.bell{position:relative;border:0;background:none;font-size:18px;cursor:pointer;padding:6px}
.bell .dot{position:absolute;top:0;inset-inline-end:0;background:var(--clay);color:#fff;font-size:10px;border-radius:9px;padding:0 5px}
select.lang{border:1px solid var(--line);border-radius:var(--r-ctl);padding:5px 6px;background:var(--surface)}

/* ---------- Composants ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h2{margin:0;font-size:22px;font-weight:600}.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-ctl);padding:8px 14px;cursor:pointer;font-weight:500;min-height:36px;white-space:nowrap}
.btn:hover{border-color:var(--ctl-border-h)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--clay);border-color:var(--danger-b)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 10px;min-height:28px;font-size:13px}
.btn.lg{min-height:48px;padding:12px 18px;font-size:15px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow);padding:18px;margin-bottom:18px}
.panel h3{margin:0 0 12px;font-size:15px;font-weight:600}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.panel-head h3{margin:0}
.grid{display:grid;gap:18px}.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;border-inline-start:3px solid var(--primary)}
.kpi.good{border-inline-start-color:var(--palm)}.kpi.warn{border-inline-start-color:#D9A21B}.kpi.bad{border-inline-start-color:var(--clay)}.kpi.neutral{border-inline-start-color:#9AA7B8}
.kpi .label{color:var(--muted);font-size:12px}
.kpi .value{font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .delta{font-size:12px;margin-top:2px}.delta.up{color:var(--palm)}.delta.down{color:var(--clay)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:500;background:var(--tag-bg);color:var(--tag-ink);white-space:nowrap}
.tag.good{background:var(--palm-soft);color:var(--palm)}.tag.warn{background:var(--saffron-soft);color:var(--saffron)}.tag.bad{background:var(--clay-soft);color:var(--clay)}.tag.info{background:var(--primary-soft);color:var(--primary)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:var(--r-ctl);padding:7px 10px;background:var(--surface);min-height:36px}
.toolbar input[type=search]{min-width:220px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse}
table.t th{background:var(--surface-2);text-align:start;font-weight:600;font-size:12px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--hover)}
table.t td.num,table.t th.num{text-align:end;font-variant-numeric:tabular-nums}
tr.vital td{background:var(--vital)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;color:var(--muted);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.loading{padding:28px;text-align:center;color:var(--muted)}
.loading::before{content:"";display:inline-block;width:14px;height:14px;border:2px solid var(--spin);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-inline-end:8px;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.loading::before{animation:none}}
.alert{padding:10px 14px;border-radius:8px;margin-bottom:12px;border:1px solid}
.alert.bad{background:var(--clay-soft);border-color:var(--alert-bad-b);color:var(--alert-bad-ink)}.alert.info{background:var(--primary-soft);border-color:var(--alert-info-b)}.alert.warn{background:var(--saffron-soft);border-color:var(--alert-warn-b);color:var(--alert-warn-ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.active{color:var(--ink);border-bottom-color:var(--primary)}
dl.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 18px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;overflow-wrap:anywhere}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h4{margin:0;font-size:15px}
.card .meta{color:var(--muted);font-size:13px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gallery figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2)}
.gallery img{width:100%;height:110px;object-fit:cover;display:block;cursor:zoom-in}
.gallery figcaption{font-size:11px;padding:4px 6px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-box{position:relative;height:300px}
.map{height:360px;border-radius:8px;border:1px solid var(--line)}

/* ---------- Formulaires & modales ---------- */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--ctl-border);border-radius:var(--r-ctl);padding:8px 10px;background:var(--field-bg);min-height:38px}
.field textarea{min-height:80px;resize:vertical}
/* Saisie en lignes (état des lieux, éditeur de documents) : lisible au téléphone, sans tableau à faire défiler. */
.in{width:100%;border:1px solid var(--ctl-border);border-radius:var(--r-ctl);padding:8px 10px;background:var(--field-bg);min-height:38px;color:inherit;font:inherit;box-sizing:border-box}
textarea.in{min-height:70px;resize:vertical}
.rows-edit .row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rows-edit .row:first-child{border-top:0}
.rows-edit .row .wide{grid-column:1/-1}
.rows-edit .row .ref{grid-column:1/-1;font-size:12px;color:var(--muted)}
.rows-edit .row select.in{width:auto;min-width:130px}
.rows-edit .row input[type=number].in{width:84px}
.field .help{font-size:11px;color:var(--muted);margin-top:3px}
.field.check{display:flex;align-items:center;gap:8px}.field.check input{width:auto;min-height:0}.field.check label{margin:0;color:var(--ink);font-size:14px}
.field .req{color:var(--clay)}
.lines-editor table{width:100%}.lines-editor input{min-height:32px;padding:5px 7px}
.modal-back{position:fixed;inset:0;background:rgba(16,35,60,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(16,35,60,.3)}
.modal.sm{max-width:460px}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:17px}
.modal .body{padding:18px 20px;max-height:70vh;overflow-y:auto}
.modal footer{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
/* Fenêtre ouverte : le bouton d'aide Rubban s'efface pour ne pas masquer les boutons de la fenêtre (téléphone). */
body:has(.modal-back) #rb-fab,body:has(.modal-back) .rb-hint{display:none}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.toasts{position:fixed;bottom:18px;inset-inline-end:18px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:380px}
.toast.bad{background:var(--clay)}.toast.good{background:var(--palm)}
.sig{border:1px dashed #AEB8C7;border-radius:8px;width:100%;height:160px;touch-action:none;background:#fff}

/* ---------- Calendrier ---------- */
.cal{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.cal table{border-collapse:collapse;min-width:100%}
.cal th,.cal td{border-inline-end:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:0;height:34px;min-width:30px;text-align:center;font-size:11px}
.cal th.prop,.cal td.prop{min-width:170px;text-align:start;padding:0 10px;position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;font-size:13px}
.cal th.we{background:var(--cal-we)}
.cal .ev{display:block;height:24px;margin:5px 0;border-radius:4px;font-size:11px;line-height:24px;color:#fff;overflow:hidden;white-space:nowrap;padding:0 6px;cursor:pointer;text-align:start}
.cal .ev.CONFIRMED{background:var(--primary)}.cal .ev.PENDING{background:#8A93D9}.cal .ev.IN_PROGRESS{background:var(--palm)}.cal .ev.COMPLETED{background:#7B8798}.cal .ev.BLOCKED{background:repeating-linear-gradient(45deg,#B9C1CD,#B9C1CD 6px,#A6AFBD 6px,#A6AFBD 12px);color:#1A2433}

/* ---------- Écrans publics ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-side{background:var(--navy);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-side::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;opacity:.12;
  background:conic-gradient(from 22.5deg at 50% 50%,#fff 0 12.5%,transparent 0 25%,#fff 0 37.5%,transparent 0 50%,#fff 0 62.5%,transparent 0 75%,#fff 0 87.5%,transparent 0) 0 0/56px 56px;
  -webkit-mask:linear-gradient(to top,#000,transparent);mask:linear-gradient(to top,#000,transparent)}
.auth-side h1{font-size:34px;line-height:1.15;margin:0 0 12px;font-weight:600;max-width:16ch}
.auth-side p{color:#B8C7DA;max-width:42ch}
.auth-main{display:flex;align-items:center;justify-content:center;padding:32px}
.auth-card{width:100%;max-width:400px}
.auth-card h2{margin:0 0 6px;font-size:24px}
.auth-card .form{grid-template-columns:1fr}
.guest-wrap{max-width:760px;margin:0 auto;padding:24px 16px 48px}

/* ---------- Responsive / terrain ---------- */
@media (max-width:1100px){.grid.c3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:150;transform:translateX(-100%);transition:transform .2s}
  html[dir=rtl] .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:none}
  .menu-btn{display:block}
  .topbar{padding:10px 14px}.content{padding:16px 14px 40px}
  .grid.c2,.grid.c3,.form{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}.auth-side{display:none}
  .user-chip small,.user-chip .uname{display:none}
  .toolbar input[type=search]{min-width:0;flex:1}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .btn{min-height:42px}
}
.scrim{position:fixed;inset:0;background:rgba(16,35,60,.4);z-index:140}
@media print{.sidebar,.topbar,.actions,.toolbar{display:none!important}.content{padding:0}}

/* ---------- Thème sombre (bouton ☀️/🌙 de la barre du haut ; par défaut : réglage de l'appareil) ---------- */
html[data-theme="dark"]{
  --navy:#0A1424; --navy-2:#13233A; --navy-3:#1D3554; --nav-ink:#B8C7DA;
  --primary:#8291FF; --primary-ink:#0B1020; --primary-soft:#1E2550;
  --palm:#4CC38A; --palm-soft:#12301F; --saffron:#E3B04B; --saffron-soft:#33270D; --clay:#F07A62; --clay-soft:#3A1A14;
  --ink:#E6EBF2; --muted:#9AA7B8; --line:#26344A; --bg:#0D1624; --surface:#152032; --surface-2:#1A273B;
  --line-2:#1F2C41; --hover:#1C2A40; --vital:#1D2547; --tag-bg:#22314A; --tag-ink:#C9D3E1; --ctl-border:#33445E; --ctl-border-h:#4A5E80;
  --spin:#3A4A63; --cal-we:#172335; --alert-bad-b:#5A2A22; --alert-bad-ink:#F6B9AC; --alert-info-b:#2E3A7A; --alert-warn-b:#5A4515; --alert-warn-ink:#F0D08A;
  --danger-b:#5A2A22; --field-bg:#0F1A2A; --shadow:0 1px 2px rgba(0,0,0,.45),0 4px 16px rgba(0,0,0,.35); color-scheme:dark;
}
html[data-theme="dark"] .brand-mark{background:#E6EBF2}
.brand-mark.logo{background:none;padding:0;overflow:hidden}.brand-mark.logo svg{width:100%;height:100%;display:block}
html[data-theme="dark"] .leaflet-container{filter:brightness(.85) contrast(1.05)}
html[data-theme="dark"] .sig{background:#fff}
html[data-theme="dark"] img{opacity:.95}
.theme-btn{background:transparent;border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;font-size:17px;line-height:1;color:var(--ink);transition:background .15s,transform .15s}
.theme-btn:hover{background:var(--surface-2);transform:rotate(-12deg)}
.legal-page{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.legal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.legal-head .brand b{color:var(--ink)}.legal-head .brand small{color:var(--muted)}
.legal-doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 26px;line-height:1.6}
.legal-doc h2{margin-top:0}.legal-doc h3{margin:20px 0 6px;font-size:16px}.legal-doc li{margin:4px 0}
mark.legal-missing{background:#FFE58A;color:#3A2E00;padding:0 4px;border-radius:4px}
.legal-links{margin-top:14px;text-align:center}.legal-links a{color:var(--muted)}
.demo-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 28px;background:#2B4C9B;color:#fff;font-size:13.5px}
.demo-banner select{background:#fff;color:#13233d;border:0;border-radius:8px;padding:5px 8px;font:inherit;max-width:100%}
.demo-banner .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.6);margin-left:auto}
.demo-picker{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px 16px;margin:0 0 18px}
.signup-cta{display:flex;flex-direction:column;gap:8px;align-items:stretch;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.signup-cta .btn{justify-content:center}
.demo-picker p{margin:4px 0 10px}.demo-views{display:flex;flex-direction:column;gap:8px}
.demo-views .btn{justify-content:flex-start;text-align:left;width:100%}
.imp-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:9px 28px;background:#B4432F;color:#fff;font-size:13.5px}
.imp-banner .btn{background:#fff;color:#7a2416;border-color:#fff;font-weight:600}
.imp-banner b{color:#fff}

/* ---------- Tutoriel ---------- */
.tour-btn{background:transparent;border:1px solid var(--line);border-radius:999px;width:36px;height:36px;font-size:17px;cursor:pointer;line-height:1}
.tour{position:fixed;inset:0;z-index:9500;pointer-events:none}
.tour-veil{position:fixed;inset:0;background:rgba(10,22,40,.55);pointer-events:auto}
.tour-spot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,22,40,.55),0 0 0 3px #e9b341;transition:all .2s ease;pointer-events:none}
.tour-bubble{position:fixed;background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px;box-shadow:0 18px 50px rgba(0,0,0,.35);pointer-events:auto;transition:top .2s,left .2s}
.tour-bubble h4{margin:2px 0 6px;font-size:16px}.tour-bubble p{margin:0 0 12px;font-size:14px;line-height:1.5}
.tour-count{font-size:11px;color:var(--muted);font-weight:600}
.tour-actions{display:flex;gap:6px;align-items:center}
.tour-off{display:flex;gap:6px;align-items:center;margin-top:10px;color:var(--muted)}
.tour-menu{position:fixed;z-index:9600;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:6px;min-width:230px}
.tour-menu button,.tour-menu label{display:flex;gap:8px;align-items:center;width:100%;padding:9px 10px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;text-align:start;cursor:pointer;border-radius:8px}
.tour-menu button:hover,.tour-menu label:hover{background:var(--line)}
body:has(.tour) #rb-fab .rb-hint{display:none}

/* ---------- Pièce d'identité : recto / verso ---------- */
.id-scan{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.id-scan-title{font-weight:600;margin-bottom:8px}
.id-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.id-slot{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.id-slot-head{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.id-thumb{width:100%;height:96px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.id-thumb.empty,.id-thumb.pdf{display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted)}
.id-thumb.pdf{font-size:12px;padding:6px;overflow:hidden;text-align:center}
.id-slot-btns{display:flex;flex-direction:column;gap:6px}
.id-slot-btns .btn{width:100%;justify-content:center}

ncies and teams\" tab).", "لا توجد وكالة حالياً. أنشئ واحدة أو أسند وكالة موجودة من صفحة العقار (تبويب «الوكالات والفرق»).", "Aún no hay ninguna agencia. Cree una o asigne una agencia existente desde la ficha de un inmueble (pestaña «Agencias y equipos»).", "Ancora nessuna agenzia. Ne crei una o assegni un'agenzia esistente dalla scheda di un immobile (scheda «Agenzie e team»).", "Nog geen bureau. Maak er een aan of wijs een bestaand bureau toe via de fiche van een pand (tabblad ‘Bureaus en teams’)."], ["Choisissez le bien que l'agence gérera en premier ; vous pourrez lui en confier d'autres ensuite.", "Choose the first property the agency will manage; you can assign others later.", "اختر أول عقار ستديره الوكالة؛ يمكنك إسناد عقارات أخرى لاحقاً.", "Elija el primer inmueble que gestionará la agencia; podrá confiarle otros después.", "Scelga il primo immobile che l'agenzia gestirà; potrà affidargliene altri in seguito.", "Kies het eerste pand dat het bureau zal beheren; u kunt er later andere aan toevertrouwen."], ["Confier un bien", "Assign a property", "إسناد عقار", "Confiar un inmueble", "Affida un immobile", "Een pand toevertrouwen"], ["Confier un bien à", "Assign a property to", "إسناد عقار إلى", "Confiar un inmueble a", "Affida un immobile a", "Een pand toevertrouwen aan"], ["Créée par vous", "Created by you", "أنشأتها أنت", "Creada por usted", "Creata da lei", "Door u aangemaakt"], ["E-mail de contact", "Contact e-mail", "البريد الإلكتروني للتواصل", "Correo de contacto", "E-mail di contatto", "Contact-e-mail"], ["Fiche de l'agence", "Agency details", "بطاقة الوكالة", "Ficha de la agencia", "Scheda dell'agenzia", "Fiche van het bureau"], ["Fiche mise à jour.", "Details updated.", "تم تحديث البطاقة.", "Ficha actualizada.", "Scheda aggiornata.", "Fiche bijgewerkt."], ["Invitation en attente :", "Pending invitation:", "دعوة قيد الانتظار:", "Invitación pendiente:", "Invito in attesa:", "Openstaande uitnodiging:"], ["Mes agences", "My agencies", "وكالاتي", "Mis agenci  kept.", "حذف هذه الوكالة؟ تُلغى صلاحياتها على عقاراتك ودعواتها المعلقة وتُعطَّل حساباتها. يُحتفظ بالسجل (الحجوزات، التدخلات…).", "¿Eliminar esta agencia? Se cancelan sus accesos a sus inmuebles y sus invitaciones pendientes, y sus cuentas se desactivan. El historial (reservas, intervenciones…) se conserva.", "Eliminare questa agenzia? I suoi accessi ai suoi immobili e i suoi inviti in attesa sono annullati, i suoi account disattivati. Lo storico (prenotazioni, interventi…) è conservato.", "Dit bureau verwijderen? De toegang tot uw panden en de openstaande uitnodigingen worden geannuleerd, de accounts worden gedeactiveerd. De geschiedenis (reserveringen, werkopdrachten…) blijft bewaard."], ["Supprimer l'agence", "Delete agency", "حذف الوكالة", "Eliminar la agencia", "Elimina l'agenzia", "Bureau verwijderen"], ["Toutes les agences qui gèrent vos biens : leurs droits bien par bien, leur fiche, et la possibilité de couper leurs accès à tout moment.", "All agencies managing your properties: their rights property by property, their details, and the option to cut their access at any time.", "كل الوكالات التي تدير عقاراتك: صلاحياتها لكل عقار، بطاقتها، وإمكانية قطع وصولها في أي وقت.", "Todas las agencias que gestionan sus inmuebles: sus permisos inmueble por inmueble, su ficha y la posibilidad de cortar su acceso en cualquier momento.", "Tutte le agenzie che gestiscono i suoi immobili: i loro permessi immobile per immobile, la loro scheda e la possibilità di interrompere il loro accesso in qualsiasi momento.", "Alle bureaus die uw panden beheren: hun rechten per pand, hun fiche en de mogelijkheid om hun toegang op elk moment af te sluiten."], ["Affichage refusé : ce site n'est pas autorisé à intégrer ImmoPilot. Ouvrez l'application depuis son adresse officielle.", "Display refused: this site is not allowed to embed ImmoPilot. Open the application from its official address.", "تم رفض العرض: هذا الموقع غير مسموح له بتضمين ImmoPilot. افتح التطبيق من عنوانه الرسمي.", "Visualiza
