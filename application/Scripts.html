const Tour = window.Tour = {
  key: function () { return "ip_tour_" + ((S.me && S.me.userId) || ""); },
  local: function () { try { return JSON.parse(localStorage.getItem(Tour.key()) || "{}") || {}; } catch (e) { return {}; } },

  save: function (patch) {

  start: function () {

      setTimeout(function () {
        const r = el ? el.getBoundingClientRect() : null, vw = window.innerWidth, vh = window.innerHeight, bw = Math.min(340, vw - 24);
        bub.style.width = bw + "px";

        veil.style.display = "none"; spot.style.display = "block";
        const pad = 6; spot.style.left = (r.left - pad) + "px"; spot.style.top = (r.top - pad) + "px"; spot.style.width = (r.width + pad * 2) + "px"; spot.style.height = (r.height + pad * 2) + "px";
        const bh = bub.offsetHeight || 180;

    return h("button", { type: "button", class: "tour-btn", title: t("Tutoriel"), "aria-label": t("Tutoriel"), onclick: function (ev) {
