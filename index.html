<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ImmoPilot</title>
<meta name="description" content="ImmoPilot — gestion immobilière (Maroc)">
<meta name="theme-color" content="#13233d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ImmoPilot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #13233d; overflow: hidden; }
  #frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f3f5f8;
           padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            color: #fff; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #13233d; transition: opacity .3s; z-index: 2; text-align: center; padding: 24px; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; }
  #splash .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
  #splash .bar i { display: block; width: 40%; height: 100%; background: #e9b341; animation: slide 1.2s infinite ease-in-out; }
  #splash p { margin: 0; opacity: .85; font-size: 14px; max-width: 420px; line-height: 1.5; }
  #splash a { color: #e9b341; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .hidden { opacity: 0; pointer-events: none; }
  #help { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3; background: #13233d; color: #fff; font: 13px -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
          padding: 8px 14px; border-radius: 20px; box-shadow: 0 4px 14px rgba(0,0,0,.25); transition: opacity .4s; white-space: nowrap; }
  #help a { color: #e9b341; }
</style>
</head>
<body>
<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <div class="bar"><i></i></div>
  <p id="msg">Chargement d'ImmoPilot…</p>
</div>
<div id="help" class="hidden">Page « Impossible d'ouvrir le fichier » ? <a id="helpLink" href="#" target="_top">Ouvrir directement</a></div>
<iframe id="frame" title="ImmoPilot" allow="camera; geolocation; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var cfg = window.IMMOPILOT_CONFIG || {}, splash = document.getElementById("splash"), msg = document.getElementById("msg"), frame = document.getElementById("frame");
  var url = String(cfg.appUrl || "");
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)) {
    msg.innerHTML = "Configuration manquante : renseignez l'URL <b>/exec</b> de l'application dans <code>config.js</code>.";
    splash.querySelector(".bar").style.display = "none";
    return;
  }
  // Les liens reçus par e-mail (invitation, activation, mot de passe, portail voyageur) sont transmis tels quels à l'application.
  var p = new URLSearchParams(location.search), q = new URLSearchParams();
  ["action", "token"].forEach(function (k) { var v = p.get(k); if (v && /^[A-Za-z0-9_-]{1,128}$/.test(v)) q.set(k, v); });
  frame.src = url + (q.toString() ? "?" + q.toString() : "");
  // Google affiche « Impossible d'ouvrir le fichier » dans le cadre quand le navigateur est connecté à plusieurs comptes Google :
  // on propose quelques secondes un lien pour ouvrir l'application directement (même application, mêmes données).
  var help = document.getElementById("help");
  document.getElementById("helpLink").href = frame.src;
  frame.addEventListener("load", function () {
    splash.classList.add("hidden");
    help.classList.remove("hidden");
    setTimeout(function () { help.classList.add("hidden"); }, 12000);
  });
  // Si Google ne répond pas (réseau lent), on propose d'ouvrir l'application directement.
  setTimeout(function () {
    if (!splash.classList.contains("hidden")) msg.innerHTML = "Le chargement prend du temps… <br><a href=\"" + frame.src + "\" target=\"_top\">Ouvrir l'application directement</a>";
  }, 15000);
  window.addEventListener("offline", function () { splash.classList.remove("hidden"); msg.textContent = "Pas de connexion Internet. ImmoPilot a besoin d'Internet pour fonctionner ; reconnectez-vous puis patientez."; });
  window.addEventListener("online", function () { msg.textContent = "Connexion rétablie, rechargement…"; location.reload(); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () { /* facultatif */ });
})();
</script>
</body>
</html>
